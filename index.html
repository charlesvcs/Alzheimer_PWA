<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Jardin</title>
<meta name="description" content="Quelques minutes d'exercices de mémoire, tranquillement, comme on sème.">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F0DFA8">
<meta name="color-scheme" content="light">

<!-- iOS : plein écran depuis l'écran d'accueil -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mon Jardin">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">

<link rel="preload" href="assets/fonts/alfa-slab-one-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app" id="app" data-variete="souci">

  <header class="band">
    <span class="band__date" id="band-date">&nbsp;</span>
    <span class="band__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21c0-5 2-8 6-10"></path>
        <path d="M12 21c0-5-2-8-6-10"></path>
        <path d="M12 21V11"></path>
        <path d="M12 11c0-4 2-6 5-7 0 4-2 6-5 7z"></path>
      </svg>
    </span>
  </header>

  <main class="stage" id="scene">
    <noscript>
      <p class="prose">Cette application a besoin que JavaScript soit activé dans Safari.</p>
    </noscript>
  </main>

  <div class="cue" id="cue" hidden aria-hidden="true"></div>
  <div class="exit" id="exit"></div>

</div>

<p class="vh" id="annonce" role="status" aria-live="polite"></p>

<script type="module" src="js/app.js"></script>
</body>
</html>
